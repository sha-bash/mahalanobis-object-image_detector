[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "moid"
version = "0.1.0"
description = "Few-shot / zero-shot object detection via VLM captions and Mahalanobis distance (mcd)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
  "scipy>=1.11",
  "sentence-transformers>=2.2",
  "joblib>=1.3",
  "pillow>=10.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
gigachat = ["langchain-gigachat>=0.5", "python-dotenv>=1.0"]
ocr = ["easyocr>=1.7"]
dino = ["transformers>=4.40", "torch>=2.1"]
dev = ["pytest>=7.0"]

[project.scripts]
moid = "moid.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
