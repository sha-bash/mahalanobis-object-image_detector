[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "moid"
version = "0.1.0"
description = "Local reference-object video detection with SBERT and mandatory Mahalanobis verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
  "scipy>=1.11",
  "sentence-transformers>=2.2",
  "joblib>=1.3",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "opencv-python>=4.8",
]

[project.optional-dependencies]
gigachat = ["langchain-gigachat>=0.5", "python-dotenv>=1.0"]
ocr = ["easyocr>=1.7"]
dino = ["transformers>=4.40", "torch>=2.1"]
video = ["opencv-python>=4.8"]
visual = ["transformers>=4.40", "torch>=2.1"]
yolo = ["ultralytics>=8.0"]
metrics = ["pycocotools>=2.0.7"]
fusion = ["ensemble-boxes>=1.0.9"]
quality = ["pycocotools>=2.0.7", "ensemble-boxes>=1.0.9", "ultralytics>=8.0"]
article = ["matplotlib>=3.8"]
dev = ["pytest>=7.0", "ruff>=0.9", "build>=1.2"]

[project.scripts]
moid = "moid.instance:main"
moid-instance = "moid.instance:main"
moid-experimental = "moid.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["venv", ".venv", "models", "reports", ".cache"]

[tool.ruff.lint]
select = ["F"]
